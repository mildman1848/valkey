# Mildman1848 Valkey defaults.
# This file is copied to /config/valkey.conf on first start.

bind 0.0.0.0 ::
port 6379
protected-mode no
dir /config
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
save 900 1
save 300 10
save 60 10000
loglevel notice
logfile ""
include /config/valkey-auth.conf
